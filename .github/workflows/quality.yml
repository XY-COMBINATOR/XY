name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Node 22 quality gate
    runs-on: ubuntu-latest
    env:
      FORMAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 22

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check changed-file formatting
        run: pnpm format:check

      - name: Check TypeScript
        run: pnpm check

      - name: Test with coverage
        run: pnpm coverage

      - name: Build production bundle
        run: pnpm build

      - name: Audit complete dependency graph
        run: pnpm audit --audit-level=moderate

      - name: Publish coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: warn
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Add coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "## Test coverage" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
